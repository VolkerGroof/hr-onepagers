<!DOCTYPE html>

<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
@page { size: A4; margin: 0; }
html, body { margin: 0; background: #d9dce3; }
body { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
a { color: #0AB0F0; text-decoration: none; }
a:hover { color: #6fd2ff; }
@media print { html, body { background: #0E1A35; } .sheet-wrap { padding: 0 !important; } }
</style>
</helmet>
<div class="sheet-wrap" style="display: flex; justify-content: center; padding: 32px 0;">
<div data-screen-label="00 Index" style="position: relative; overflow: hidden; width: 794px; height: 1123px; box-sizing: border-box; padding: 36px 48px 32px; background: #0E1A35; color: #FFFFFF; font-family: 'Figtree', system-ui, sans-serif; display: flex; flex-direction: column; gap: 36px;">

  <div style="display: flex; justify-content: space-between; align-items: center;">
    <div style="font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 0.26em; color: #A9B6CF;">GROOF ONE PAGERS</div>
    <div style="font-size: 22px; font-weight: 800; letter-spacing: -0.03em; color: #0AB0F0;">Groof</div>

    <div style="font-size: 70px; line-height: 0.9; font-weight: 800; letter-spacing: -0.05em; color: #0AB0F0;">One page at a time.</div>

  </div>

  <div style="display: flex; flex-direction: column; gap: 10px;">
    <div style="font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.22em; color: #A9B6CF;">GROOF VS</div>
    <div style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px;">
      <sc-for list="{{ vs }}" as="v" hint-placeholder-count="5">
        <a href="{{ v.href }}" style="background: #11264F; border: 1px solid #1F6FA8; padding: 22px 14px; color: #FFFFFF; display: flex; flex-direction: column; gap: 4px;" style-hover="border-color: #0AB0F0; background: #16305F;">
          <span style="font-size: 18px; font-weight: 700;">{{ v.t }}</span>
          <span style="font-size: 13px; line-height: 1.35; color: #A9B6CF;">{{ v.d }}</span>
        </a>
      </sc-for>
    </div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 10px;">
    <div style="font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.22em; color: #A9B6CF;">HR LIFECYCLE</div>
    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px;">
      <sc-for list="{{ life }}" as="l" hint-placeholder-count="12">
        <a href="{{ l.href }}" style="background: #11264F; border: 1px solid #1F6FA8; padding: 20px 16px; color: #FFFFFF; display: grid; grid-template-columns: 26px minmax(0, 1fr); gap: 2px 8px; align-items: baseline;" style-hover="border-color: #0AB0F0; background: #16305F;">
          <span style="font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #0AB0F0;">{{ l.n }}</span>
          <span style="font-size: 18px; font-weight: 700;">{{ l.t }}</span>
          <span></span>
          <span style="font-size: 13px; line-height: 1.35; color: #A9B6CF;">{{ l.d }}</span>
        </a>
      </sc-for>
    </div>
  </div>

  <div style="display: flex; justify-content: space-between; align-items: center; gap: 20px; border-top: 1px solid #0AB0F0; padding-top: 12px; margin-top: auto;">
    <div style="font-size: 20px; line-height: 1.15; font-weight: 800; letter-spacing: -0.02em;">Be part of the leading pack.<br><span style="color: #0AB0F0;">Your decision.</span></div>
    <a href="https://calendar.app.google/n9NxSQKVSWHtaqTg7" target="_blank" style="background: #0AB0F0; color: #0E1A35; padding: 12px 18px; font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 500; letter-spacing: 0.14em; white-space: nowrap;" style-hover="background: #6fd2ff; color: #0E1A35;">BOOK A 30-MIN DEMO →</a>
  </div>

</div>
</div>
